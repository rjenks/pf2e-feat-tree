name: Build and publish to GitHub Pages

# The page is built from the current foundryvtt/pf2e release, so besides
# rebuilding on every push it is rebuilt nightly to pick up new releases.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked

      # Downloads the foundryvtt/pf2e data and builds the rules database that
      # pf2e-mcp's rules_sql reads. Nothing from it is committed.
      - name: Build rules database
        run: uv run python -m pf2e_mcp.ingestion.build

      - name: Fetch prerequisite data
        run: uv run python src/fetch_data.py

      - name: Generate page
        run: uv run python src/generate.py dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
